# ─────────────────────────────────────────────────────────────────────────────
# Development — seluruh aplikasi berjalan di Docker dengan hot reload.
#
#   cp deploy/env/.env.development.example deploy/env/.env.development
#   docker compose -f deploy/compose.dev.yml up --build
#   docker compose -f deploy/compose.dev.yml run --rm seed   # data contoh
#
# Port host: API 3000 · dashboard 3001 · storefront 4321 · Postgres 5433
# (5433 agar tidak bentrok dengan PostgreSQL native di 5432).
# ─────────────────────────────────────────────────────────────────────────────
name: catering-dev

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

x-dev-image: &dev-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile.dev
  image: catering/dev:local
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# Source di-bind-mount agar perubahan langsung terlihat. node_modules tetap dari
# image supaya dependensi tidak bentrok dengan host (mis. macOS vs Linux).
x-source: &source
  - ../apps/api/src:/repo/apps/api/src
  - ../apps/web/src:/repo/apps/web/src
  - ../apps/dashboard/src:/repo/apps/dashboard/src
  - ../packages/core/src:/repo/packages/core/src
  - ../packages/contracts/src:/repo/packages/contracts/src

x-app: &app
  <<: *dev-image
  env_file:
    - env/.env.development
  volumes: *source
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  db:
    image: postgres:16-alpine
    env_file:
      - env/.env.development
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - catering_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-catering} -d ${POSTGRES_DB:-catering_dev}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    <<: *logging

  # Menjalankan migrasi sekali sebelum aplikasi naik.
  migrate:
    <<: *dev-image
    command: pnpm --filter @catering/core db:migrate
    env_file:
      - env/.env.development
    volumes: *source
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app
    command: pnpm --filter @catering/api dev
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: pnpm --filter @catering/api dev:worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command: pnpm --filter @catering/web dev --host 0.0.0.0
    environment:
      PORT: '4321'
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${WEB_PORT:-4321}:4321'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4321/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    <<: *app
    command: pnpm --filter @catering/dashboard dev --host 0.0.0.0
    environment:
      PORT: '3001'
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/login >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Data contoh hanya untuk development:
  # docker compose -f deploy/compose.dev.yml run --rm seed
  seed:
    <<: *dev-image
    command: pnpm --filter @catering/core db:seed
    env_file:
      - env/.env.development
    volumes: *source
    profiles: ['seed']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  catering_dev_pgdata:
    name: catering_dev_pgdata
